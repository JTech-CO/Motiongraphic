<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DJI 2006—2026 · Motion Graphic</title>
  <meta name="description" content="25초, 120 BPM 데이터 모션그래픽. DJI 2006–2026 데이터셋 기반.">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/stage.css">
  <link rel="stylesheet" href="css/hud.css">
  <link rel="stylesheet" href="css/scenes.css">
  <link rel="stylesheet" href="css/controls.css">
</head>
<body>
  <main id="viewport" aria-label="DJI 2006—2026 motion graphic">
    <div id="stage">
      <canvas id="streaks" width="1920" height="1080"></canvas>
      <div id="scenes"></div>
      <div id="transition-layer"></div>
      <div id="letterbox"></div>
      <div id="grain"></div>
      <div id="hud"></div>
      <div id="beatgrid" hidden></div>
    </div>
  </main>

  <div id="controls" role="toolbar" aria-label="Player controls"></div>

  <script defer src="js/core/util.js"></script>
  <script defer src="js/core/timeline.js"></script>
  <script defer src="js/data.js"></script>
  <script defer src="js/ui/components.js"></script>
  <script defer src="js/ui/products.js"></script>
  <script defer src="js/fx/landscape.js"></script>
  <script defer src="js/fx/textures.js"></script>
  <script defer src="js/hud.js"></script>
  <script defer src="js/scenes/01-hook.js"></script>
  <script defer src="js/scenes/02-reveal.js"></script>
  <script defer src="js/scenes/03-proof.js"></script>
  <script defer src="js/scenes/04-share.js"></script>
  <script defer src="js/scenes/05-spec.js"></script>
  <script defer src="js/scenes/06-249g.js"></script>
  <script defer src="js/scenes/07-handheld.js"></script>
  <script defer src="js/scenes/08-crossover.js"></script>
  <script defer src="js/scenes/09-revenue.js"></script>
  <script defer src="js/scenes/10-wall.js"></script>
  <script defer src="js/scenes/11-montage.js"></script>
  <script defer src="js/scenes/12-endcard.js"></script>
  <script defer src="js/transitions.js"></script>
  <script defer src="js/engine.js"></script>
  <script defer src="js/audio.js"></script>
  <script defer src="js/controls.js"></script>
  <script defer src="js/main.js"></script>
</body>
</html>
