<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loopfield Studio · Motion Graphic</title>
  <meta name="description" content="25초, 120 BPM 모션그래픽. Loopfield Studio 프리셋 GLSL을 WebGL 2로 직접 렌더링한 소개 영상.">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/stage.css">
  <link rel="stylesheet" href="css/hud.css">
  <link rel="stylesheet" href="css/scenes.css">
  <link rel="stylesheet" href="css/controls.css">
</head>
<body>
  <main id="viewport" aria-label="Loopfield Studio motion graphic">
    <div id="stage">
      <canvas id="gl" width="1920" height="1080"></canvas>
      <div id="scenes"></div>
      <div id="grain"></div>
      <div id="hud"></div>
      <div id="beatgrid" hidden></div>
    </div>
  </main>

  <div id="controls" role="toolbar" aria-label="Player controls"></div>

  <script defer src="js/core/util.js"></script>
  <script defer src="js/core/timeline.js"></script>
  <script defer src="js/data.js"></script>
  <script defer src="js/ui/components.js"></script>
  <script defer src="js/fx/presets.js"></script>
  <script defer src="js/fx/gl.js"></script>
  <script defer src="js/fx/ink.js"></script>
  <script defer src="js/fx/textures.js"></script>
  <script defer src="js/hud.js"></script>
  <script defer src="js/scenes/01-hook.js"></script>
  <script defer src="js/scenes/02-reveal.js"></script>
  <script defer src="js/scenes/03-library.js"></script>
  <script defer src="js/scenes/04-layers.js"></script>
  <script defer src="js/scenes/05-palettes.js"></script>
  <script defer src="js/scenes/06-slider.js"></script>
  <script defer src="js/scenes/07-loop.js"></script>
  <script defer src="js/scenes/08-output.js"></script>
  <script defer src="js/scenes/09-local.js"></script>
  <script defer src="js/scenes/10-code.js"></script>
  <script defer src="js/scenes/11-montage.js"></script>
  <script defer src="js/scenes/12-endcard.js"></script>
  <script defer src="js/transitions.js"></script>
  <script defer src="js/engine.js"></script>
  <script defer src="js/audio.js"></script>
  <script defer src="js/controls.js"></script>
  <script defer src="js/main.js"></script>
</body>
</html>
