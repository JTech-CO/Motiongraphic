<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SpaceX 2002—2026 · Motion Graphic</title>
  <meta name="description" content="25초, 120 BPM 데이터 모션그래픽. SpaceX 2002–2026 데이터셋 기반.">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/stage.css">

  <link rel="stylesheet" href="css/scenes.css">
  <link rel="stylesheet" href="css/controls.css">
</head>
<body>
  <main id="viewport" aria-label="SpaceX 2002—2026 motion graphic">

  <script defer src="js/hud.js"></script>
  <script defer src="js/scenes/01-hook.js"></script>

  <script defer src="js/scenes/03-orbit.js"></script>
  <script defer src="js/scenes/04-landing.js"></script>

  <script defer src="js/scenes/06-cadence.js"></script>
  <script defer src="js/scenes/07-share.js"></script>

  <script defer src="js/scenes/10-ipo.js"></script>

  <script defer src="js/audio.js"></script>
  <script defer src="js/controls.js"></script>
  <script defer src="js/main.js"></script>

</html>
